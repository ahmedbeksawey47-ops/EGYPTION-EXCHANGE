<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الصرافة المصرية - فرع سمالوط</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel (ضروري جداً لتحويل أكواد React/JSX على GitHub Pages) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_RATES = [
            { code: 'USD', name: 'دولار أمريكي', buy: 48.50, sell: 48.60 },
            { code: 'EUR', name: 'يورو أوروبي', buy: 52.30, sell: 52.50 },
            { code: 'SAR', name: 'ريال سعودي', buy: 12.92, sell: 12.96 },
            { code: 'AED', name: 'درهم إماراتي', buy: 13.20, sell: 13.24 },
            { code: 'GBP', name: 'جنيه إسترليني', buy: 61.80, sell: 62.15 },
            { code: 'KWD', name: 'دينار كويتي', buy: 157.80, sell: 158.50 },
            { code: 'QAR', name: 'ريال قطري', buy: 13.30, sell: 13.35 },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('rates');
            const [currencies, setCurrencies] = useState(INITIAL_RATES);
            const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString('ar-EG'));
            const [loadingRates, setLoadingRates] = useState(false);

            const [calcAmount, setCalcAmount] = useState(100);
            const [calcCurrency, setCalcCurrency] = useState('USD');
            const [calcType, setCalcType] = useState('buy');

            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [serviceType, setServiceType] = useState('standard');
            const [expectedAmount, setExpectedAmount] = useState('');
            const [appointmentTime, setAppointmentTime] = useState('');
            const [myTicket, setMyTicket] = useState(null);

            const fetchLiveRates = async () => {
                setLoadingRates(true);
                try {
                    const res = await fetch('https://open.er-api.com/v6/latest/USD');
                    const data = await res.json();
                    if (data && data.rates && data.rates.EGP) {
                        const usdEgp = data.rates.EGP;
                        const eurEgp = usdEgp / (data.rates.EUR || 0.92);
                        const sarEgp = usdEgp / (data.rates.SAR || 3.75);
                        const aedEgp = usdEgp / (data.rates.AED || 3.67);
                        const gbpEgp = usdEgp / (data.rates.GBP || 0.78);
                        const kwdEgp = usdEgp / (data.rates.KWD || 0.31);
                        const qarEgp = usdEgp / (data.rates.QAR || 3.64);

                        setCurrencies([
                            { code: 'USD', name: 'دولار أمريكي', buy: (usdEgp - 0.10), sell: usdEgp },
                            { code: 'EUR', name: 'يورو أوروبي', buy: (eurEgp - 0.15), sell: eurEgp },
                            { code: 'SAR', name: 'ريال سعودي', buy: (sarEgp - 0.04), sell: sarEgp },
                            { code: 'AED', name: 'درهم إماراتي', buy: (aedEgp - 0.04), sell: aedEgp },
                            { code: 'GBP', name: 'جنيه إسترليني', buy: (gbpEgp - 0.20), sell: gbpEgp },
                            { code: 'KWD', name: 'دينار كويتي', buy: (kwdEgp - 0.50), sell: kwdEgp },
                            { code: 'QAR', name: 'ريال قطري', buy: (qarEgp - 0.05), sell: qarEgp },
                        ]);
                        setLastUpdated(new Date().toLocaleTimeString('ar-EG'));
                    }
                } catch (e) {
                    console.log("خطأ بالاتصال بالشبكة");
                } finally {
                    setLoadingRates(false);
                }
            };

            useEffect(() => {
                fetchLiveRates();
            }, []);

            const handleGetTicket = (e) => {
                e.preventDefault();
                if (!customerPhone) {
                    alert('يرجى إدخال رقم الهاتف أولاً');
                    return;
                }

                const prefix = serviceType === 'express' ? 'F' : serviceType === 'appointment' ? 'B' : 'A';
                const ticketNumber = `${prefix}-${Math.floor(Math.random() * 80) + 100}`;
                const aheadCount = Math.floor(Math.random() * 4) + 2;

                setMyTicket({
                    number: ticketNumber,
                    name: customerName || 'عميل محترم',
                    phone: customerPhone,
                    service: serviceType === 'express' ? 'تجهيز نقدية مسبقاً' : serviceType === 'appointment' ? 'حجز موعد' : 'صرف عادي',
                    ahead: aheadCount
                });
            };

            const selectedCurrObj = currencies.find(c => c.code === calcCurrency) || currencies[0];
            const currentRate = calcType === 'buy' ? selectedCurrObj.buy : selectedCurrObj.sell;
            const totalEgp = (calcAmount * currentRate).toLocaleString('ar-EG', { maximumFractionDigits: 2 });

            return (
                <div className="min-h-screen bg-slate-100 text-slate-800 pb-16">
                    {/* Header */}
                    <header className="bg-[#0B192C] text-white shadow-xl border-b-4 border-[#D4AF37]">
                        <div className="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 bg-gradient-to-tr from-[#D4AF37] to-[#FFD700] rounded-2xl flex items-center justify-center text-[#0B192C] font-black text-2xl shadow-lg">
                                    <i className="fa-solid fa-building-columns"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-[#FFD700]">شركة الصرافة المصرية</h1>
                                    <p className="text-xs text-slate-300 flex items-center gap-1.5 mt-0.5">
                                        <i className="fa-solid fa-location-dot text-[#D4AF37]"></i> فرع سمالوط - الشارع الجديد بجوار البنك الأهلي
                                    </p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 text-xs">
                                <a href="tel:0863446519" className="bg-slate-800 hover:bg-[#D4AF37] hover:text-[#0B192C] border border-slate-700 px-3.5 py-2 rounded-xl transition-all font-bold flex items-center gap-2 text-white">
                                    <i className="fa-solid fa-phone text-[#D4AF37]"></i> 086-3446519
                                </a>
                                <a href="https://maps.google.com/?q=Samalut+Minya+Egypt" target="_blank" className="bg-[#D4AF37] hover:bg-[#FFD700] text-[#0B192C] px-3.5 py-2 rounded-xl transition-all font-black flex items-center gap-2 shadow-md">
                                    <i className="fa-solid fa-map-location-dot"></i> موقع GPS
                                </a>
                            </div>
                        </div>

                        <div className="bg-[#1E3E62] py-2.5 px-4 text-xs text-slate-100">
                            <div className="max-w-7xl mx-auto flex flex-wrap justify-around items-center gap-2 text-center">
                                <div><i className="fa-regular fa-clock text-[#FFD700] ml-1.5"></i><strong>أوقات العمل:</strong> يومياً من 8:00 صباحاً حتى 9:00 مساءً</div>
                                <div className="hidden md:block text-slate-500">|</div>
                                <div><i className="fa-solid fa-mosque text-[#FFD700] ml-1.5"></i><strong>الجمعة:</strong> من بعد صلاة الجمعة حتى 9:00 مساءً</div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="max-w-7xl mx-auto px-4 mt-8">
                        <div className="flex border-b border-slate-300 overflow-x-auto gap-2">
                            <button onClick={()=>setActiveTab('rates')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all ${activeTab==='rates'?'bg-[#0B192C] text-[#FFD700] shadow-lg':'bg-white text-slate-600 hover:bg-slate-200'}`}>
                                <i className="fa-solid fa-calculator ml-1"></i> أسعار العملات والحاسبة
                            </button>
                            <button onClick={()=>setActiveTab('queue')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all ${activeTab==='queue'?'bg-[#0B192C] text-[#FFD700] shadow-lg':'bg-white text-slate-600 hover:bg-slate-200'}`}>
                                <i className="fa-solid fa-ticket ml-1"></i> حجز تذكرة انتظار ذكية
                            </button>
                            <button onClick={()=>setActiveTab('monitor')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all ${activeTab==='monitor'?'bg-[#0B192C] text-[#FFD700] shadow-lg':'bg-white text-slate-600 hover:bg-slate-200'}`}>
                                <i className="fa-solid fa-desktop ml-1"></i> شاشة الشبابيك
                            </button>
                        </div>
                    </div>

                    {/* Content */}
                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        {activeTab === 'rates' && (
                            <div className="grid lg:grid-cols-3 gap-8">
                                <div className="lg:col-span-2 bg-white p-6 rounded-3xl border border-slate-200 shadow-md">
                                    <div className="flex justify-between items-center mb-6">
                                        <div>
                                            <h2 className="text-xl font-black text-[#0B192C]">أسعار الصرف الرسمية الحية</h2>
                                            <p className="text-xs text-slate-500 mt-1">تحديث تلقائي: {lastUpdated}</p>
                                        </div>
                                        <button onClick={fetchLiveRates} disabled={loadingRates} className="bg-[#0B192C] text-[#FFD700] px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
                                            <i className={`fa-solid fa-rotate ${loadingRates ? 'animate-spin' : ''}`}></i> تحديث
                                        </button>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-right">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-xs text-slate-500 font-bold">
                                                    <th className="pb-3">العملة</th>
                                                    <th className="pb-3">شراء</th>
                                                    <th className="pb-3">بيع</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {currencies.map(curr => (
                                                    <tr key={curr.code} className="hover:bg-slate-50">
                                                        <td className="py-4 font-bold">{curr.name} ({curr.code})</td>
                                                        <td className="py-4 font-bold text-emerald-600">{curr.buy.toFixed(2)} ج.م</td>
                                                        <td className="py-4 font-bold text-slate-900">{curr.sell.toFixed(2)} ج.م</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-[#0B192C] text-white p-6 rounded-3xl shadow-xl flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-lg font-black text-[#FFD700] mb-4"><i className="fa-solid fa-calculator"></i> الآلة الحاسبة</h3>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs mb-1 font-bold">المعاملة</label>
                                                <div className="grid grid-cols-2 gap-2 bg-slate-800 p-1 rounded-xl">
                                                    <button type="button" onClick={()=>setCalcType('buy')} className={`py-2 text-xs font-bold rounded-lg ${calcType==='buy'?'bg-[#D4AF37] text-[#0B192C]':'text-slate-300'}`}>شراء</button>
                                                    <button type="button" onClick={()=>setCalcType('sell')} className={`py-2 text-xs font-bold rounded-lg ${calcType==='sell'?'bg-[#D4AF37] text-[#0B192C]':'text-slate-300'}`}>بيع</button>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs mb-1 font-bold">العملة</label>
                                                <select value={calcCurrency} onChange={e=>setCalcCurrency(e.target.value)} className="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white">
                                                    {currencies.map(c => <option key={c.code} value={c.code}>{c.name}</option>)}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs mb-1 font-bold">المبلغ</label>
                                                <input type="number" value={calcAmount} onChange={e=>setCalcAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white text-left font-bold" dir="ltr" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 pt-6 border-t border-slate-800">
                                        <p className="text-xs text-slate-400 mb-1">المبلغ الإجمالي بالجنيه المصري</p>
                                        <div className="text-3xl font-black text-[#FFD700]">{totalEgp} <span className="text-sm font-normal text-slate-300">ج.م</span></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'queue' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-md">
                                    <h2 className="text-xl font-black text-[#0B192C] mb-4">حجز تذكرة انتظار ذكية</h2>
                                    <form onSubmit={handleGetTicket} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">الاسم بالكامل</label>
                                            <input type="text" value={customerName} onChange={e=>setCustomerName(e.target.value)} placeholder="مثال: أحمد محمد" className="w-full bg-slate-50 border border-slate-300 p-3 rounded-xl text-slate-900" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف (الواتساب)</label>
                                            <input type="tel" required value={customerPhone} onChange={e=>setCustomerPhone(e.target.value)} placeholder="01012345678" className="w-full bg-slate-50 border border-slate-300 p-3 rounded-xl text-left text-slate-900" dir="ltr" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">نوع الخدمة والمسار</label>
                                            <select value={serviceType} onChange={e=>setServiceType(e.target.value)} className="w-full bg-slate-50 border border-slate-300 p-3 rounded-xl text-slate-900">
                                                <option value="standard">صرف أو تحويل عادي (Standard)</option>
                                                <option value="express">تجهيز النقدية مسبقاً (Express)</option>
                                                <option value="appointment">حجز موعد (Booking)</option>
                                            </select>
                                        </div>

                                        <button type="submit" className="w-full bg-[#0B192C] text-[#FFD700] font-black py-4 rounded-xl shadow-lg">
                                            قطع تذكرة الدور الان
                                        </button>
                                    </form>
                                </div>

                                <div className="flex items-center justify-center">
                                    {myTicket ? (
                                        <div className="bg-[#0B192C] text-white border-2 border-[#D4AF37] rounded-3xl p-6 shadow-2xl text-center w-full">
                                            <p className="text-xs text-[#D4AF37] font-bold">رقم تذكرتك الذكية</p>
                                            <div className="text-6xl font-black text-[#FFD700] my-3">{myTicket.number}</div>
                                            <p className="text-sm font-bold text-white mb-2">{myTicket.name}</p>
                                            <p className="text-xs text-slate-300">العملاء المنتظرين قبلك: <strong className="text-[#FFD700] text-sm">{myTicket.ahead}</strong></p>
                                        </div>
                                    ) : (
                                        <p className="text-slate-400 text-sm">ادخل بياناتك بالأعلى للحصول على تذكرة دورك</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'monitor' && (
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-md text-center">
                                <h2 className="text-xl font-black text-[#0B192C] mb-6">شاشة عرض صالة الانتظار</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-[#0B192C] p-5 rounded-2xl border-b-4 border-emerald-500 text-white">
                                        <p className="text-xs text-slate-300 mb-1">شباك 1</p>
                                        <p className="text-3xl font-black text-[#FFD700]">A-102</p>
                                    </div>
                                    <div className="bg-[#0B192C] p-5 rounded-2xl border-b-4 border-emerald-500 text-white">
                                        <p className="text-xs text-slate-300 mb-1">شباك 2</p>
                                        <p className="text-3xl font-black text-[#FFD700]">A-103</p>
                                    </div>
                                    <div className="bg-[#0B192C] p-5 rounded-2xl border-b-4 border-[#D4AF37] text-white">
                                        <p className="text-xs text-[#FFD700] mb-1">شباك 3 (سريع)</p>
                                        <p className="text-3xl font-black text-[#FFD700]">F-15</p>
                                    </div>
                                    <div className="bg-[#0B192C] p-5 rounded-2xl border-b-4 border-emerald-500 text-white">
                                        <p className="text-xs text-slate-300 mb-1">شباك 4</p>
                                        <p className="text-3xl font-black text-[#FFD700]">B-201</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
