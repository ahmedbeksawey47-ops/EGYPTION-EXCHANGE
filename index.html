
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الصرافة المصرية - فرع سمالوط</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel JS CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_CURRENCIES = [
            { code: 'USD', name: 'دولار أمريكي', buy: 48.50, sell: 48.60, change: '+0.10' },
            { code: 'EUR', name: 'يورو أوروبي', buy: 52.30, sell: 52.50, change: '-0.05' },
            { code: 'SAR', name: 'ريال سعودي', buy: 12.92, sell: 12.96, change: '0.00' },
            { code: 'AED', name: 'درهم إماراتي', buy: 13.20, sell: 13.24, change: '0.00' },
            { code: 'GBP', name: 'جنيه إسترليني', buy: 61.80, sell: 62.15, change: '+0.25' },
            { code: 'KWD', name: 'دينار كويتي', buy: 157.80, sell: 158.50, change: '+0.40' },
            { code: 'QAR', name: 'ريال قطري', buy: 13.30, sell: 13.35, change: '0.00' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('queue');
            const [currencies, setCurrencies] = useState(INITIAL_CURRENCIES);
            const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString('ar-EG'));
            
            // Calculator State
            const [calcAmount, setCalcAmount] = useState(100);
            const [calcCurrency, setCalcCurrency] = useState('USD');
            const [calcType, setCalcType] = useState('buy');

            // Queue Form State
            const [phone, setPhone] = useState('');
            const [serviceType, setServiceType] = useState('standard'); // standard, pre-order, appointment
            const [amount, setAmount] = useState('');
            const [selectedCurrency, setSelectedCurrency] = useState('USD');
            const [appointmentTime, setAppointmentTime] = useState('');
            const [isFastTrack, setIsFastTrack] = useState(false);
            const [myTicket, setMyTicket] = useState(null);

            // WhatsApp Config
            const [waInstanceId, setWaInstanceId] = useState('');
            const [waToken, setWaToken] = useState('');
            const [waStatus, setWaStatus] = useState('');

            // Live Queue State
            const [currentServing, setCurrentServing] = useState({ window1: 'A-101', window2: 'A-102', window3: 'B-201 (سريع)', window4: 'A-103' });
            const [avgTime, setAvgTime] = useState(3.5); // دقائق

            // Fetch Live Rates simulation/API
            useEffect(() => {
                const timer = setInterval(() => {
                    setLastUpdated(new Date().toLocaleTimeString('ar-EG'));
                }, 60000);
                return () => clearInterval(timer);
            }, []);

            // Handle Ticket Creation
            const handleGetTicket = (e) => {
                e.preventDefault();
                if (!phone) {
                    alert('يرجى إدخال رقم الواتساب أولاً');
                    return;
                }

                const ticketNum = isFastTrack ? `F-${Math.floor(Math.random() * 50) + 10}` : `A-${Math.floor(Math.random() * 80) + 105}`;
                const newTicket = {
                    number: ticketNum,
                    phone: phone,
                    type: serviceType,
                    amount: amount ? `${amount} ${selectedCurrency}` : 'غير محدد',
                    time: appointmentTime || 'الآن',
                    peopleAhead: Math.floor(Math.random() * 4) + 2, // محاكاة أرقام المنتظرين
                };

                setMyTicket(newTicket);

                // إرسال واتساب تجريبي في حال توفر بيانات API
                if (waInstanceId && waToken) {
                    sendWhatsAppNotification(phone, `مرحباً بك في شركة الصرافة المصرية - فرع سمالوط.\nرقم دورك الإلكتروني هو: ${ticketNum}\nعدد العملاء قبلك: ${newTicket.peopleAhead}`);
                }
            };

            const sendWhatsAppNotification = (toPhone, message) => {
                setWaStatus('جاري إرسال إشعار الواتساب...');
                fetch(`https://api.ultramsg.com/${waInstanceId}/messages/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'token': waToken,
                        'to': toPhone,
                        'body': message
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.sent) setWaStatus('تم إرسال إشعار الواتساب بنجاح! 🟢');
                    else setWaStatus('تعذر الإرسال، تحقق من بيانات API 🔴');
                })
                .catch(() => setWaStatus('خطأ في الاتصال بالخدمة 🔴'));
            };

            const currentCurrObj = currencies.find(c => c.code === calcCurrency) || currencies[0];
            const rate = calcType === 'buy' ? currentCurrObj.buy : currentCurrObj.sell;
            const totalEGP = (calcAmount * rate).toLocaleString('ar-EG', { maximumFractionDigits: 2 });

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-12">
                    {/* Top Header */}
                    <header className="bg-slate-900 text-white shadow-xl border-b-4 border-amber-500">
                        <div className="max-w-7xl mx-auto px-4 py-6">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center text-slate-900 font-extrabold text-2xl shadow-lg">
                                        <i className="fa-solid font-bold fa-building-columns"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-black text-amber-400">شركة الصرافة المصرية</h1>
                                        <p className="text-sm text-slate-300 font-medium"><i className="fa-solid fa-location-dot text-amber-500 ml-1"></i> فرع سمالوط - محافظة المنيا</p>
                                    </div>
                                </div>

                                <div className="flex flex-wrap gap-3 text-xs md:text-sm">
                                    <a href="tel:0863446509" className="bg-slate-800 hover:bg-amber-500 hover:text-slate-900 border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-2 transition-all font-bold">
                                        <i className="fa-solid fa-phone text-amber-400"></i> 086-3446509
                                    </a>
                                    <a href="tel:0863446519" className="bg-slate-800 hover:bg-amber-500 hover:text-slate-900 border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-2 transition-all font-bold">
                                        <i className="fa-solid fa-phone text-amber-400"></i> 086-3446519
                                    </a>
                                    <a href="https://maps.google.com/?q=Samalut+Minya+Egypt" target="_blank" className="bg-amber-500 text-slate-900 hover:bg-amber-400 px-4 py-2 rounded-xl flex items-center gap-2 font-bold transition-all">
                                        <i className="fa-solid fa-map-location-dot"></i> موقع GPS
                                    </a>
                                </div>
                            </div>

                            {/* Working Hours Banner */}
                            <div className="mt-6 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3 flex flex-wrap items-center justify-around text-xs md:text-sm text-slate-200 gap-2">
                                <div><i className="fa-regular fa-clock text-amber-400 ml-2"></i><strong>السبت - الخميس:</strong> من 8:00 صباحاً حتى 9:00 مساءً</div>
                                <div className="h-4 w-px bg-slate-600 hidden md:block"></div>
                                <div><i className="fa-solid fa-mosque text-amber-400 ml-2"></i><strong>يوم الجمعة:</strong> من بعد صلاة الجمعة حتى 9:00 مساءً</div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="max-w-7xl mx-auto px-4 mt-6">
                        <div className="flex border-b border-slate-200 overflow-x-auto gap-2">
                            <button onClick={() => setActiveTab('queue')} className={`px-5 py-3 font-bold rounded-t-xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'queue' ? 'bg-amber-500 text-slate-900 shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>
                                <i className="fa-solid fa-ticket"></i> حجز دور ذكي
                            </button>
                            <button onClick={() => setActiveTab('rates')} className={`px-5 py-3 font-bold rounded-t-xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'rates' ? 'bg-amber-500 text-slate-900 shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>
                                <i className="fa-solid fa-calculator"></i> أسعار العملات والحاسبة
                            </button>
                            <button onClick={() => setActiveTab('monitor')} className={`px-5 py-3 font-bold rounded-t-xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'monitor' ? 'bg-amber-500 text-slate-900 shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>
                                <i className="fa-solid fa-desktop"></i> شاشة الصالة والتحليل
                            </button>
                            <button onClick={() => setActiveTab('api')} className={`px-5 py-3 font-bold rounded-t-xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'api' ? 'bg-amber-500 text-slate-900 shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>
                                <i className="fa-brands fa-whatsapp"></i> إعدادات الواتساب
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 mt-6">
                        {/* TAB 1: SMART QUEUE */}
                        {activeTab === 'queue' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-id-card text-amber-500"></i> حجز رقم دور إلكتروني مسبق
                                    </h2>
                                    <p className="text-xs text-slate-500 mb-6">احجز دورك لتصلك رسالة الواتساب وتتجنب الانتظار داخل الصالة.</p>

                                    <form onSubmit={handleGetTicket} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">رقم الواتساب (مطلوب لاستلام التنبيه)</label>
                                            <input type="tel" required placeholder="01012345678" value={phone} onChange={e=>setPhone(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-left" dir="ltr" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">نوع الخدمة</label>
                                            <select value={serviceType} onChange={e=>setServiceType(e.target.value)} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
                                                <option value="standard">صرف / تغيير عادي</option>
                                                <option value="pre-order">صرف مسبق (تحديد المبلغ مسبقاً للتأكيد المباشر)</option>
                                                <option value="appointment">حجز موعد محدد في وقت لاحق</option>
                                            </select>
                                        </div>

                                        {serviceType === 'pre-order' && (
                                            <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">المبلغ المطلوب</label>
                                                    <input type="number" placeholder="1000" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">العملة</label>
                                                    <select value={selectedCurrency} onChange={e=>setSelectedCurrency(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none">
                                                        {currencies.map(c => <option key={c.code} value={c.code}>{c.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                        )}

                                        {serviceType === 'appointment' && (
                                            <div className="p-4 bg-blue-50 border border-blue-200 rounded-2xl">
                                                <label className="block text-xs font-bold text-slate-700 mb-1">اختر وقت الحجز</label>
                                                <input type="time" value={appointmentTime} onChange={e=>setAppointmentTime(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none" />
                                            </div>
                                        )}

                                        <div className="flex items-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                                            <input type="checkbox" id="fastTrack" checked={isFastTrack} onChange={e=>setIsFastTrack(e.target.checked)} className="w-4 h-4 text-amber-500 rounded" />
                                            <label htmlFor="fastTrack" className="text-xs font-bold text-slate-700 cursor-pointer">
                                                تحويل للمسار السريع (مبالغ محدودة أقل من 500 دولار / طلب جاهز)
                                            </label>
                                        </div>

                                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-paper-plane"></i> اصدار تذكرة الانتظار
                                        </button>
                                    </form>
                                </div>

                                {/* Ticket View Card */}
                                <div>
                                    {myTicket ? (
                                        <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl border-2 border-amber-500 relative overflow-hidden">
                                            <div className="absolute -top-10 -left-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
                                            <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                                                <span className="text-xs font-bold text-amber-400">تذكرة رقمية نشطة</span>
                                                <span className="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300">{myTicket.phone}</span>
                                            </div>

                                            <div className="text-center py-6">
                                                <p className="text-xs text-slate-400 mb-1">رقم الدور الخاص بك</p>
                                                <div className="text-6xl font-black text-amber-400 tracking-wider mb-2">{myTicket.number}</div>
                                                <div className="inline-flex items-center gap-2 bg-amber-500/10 text-amber-400 px-4 py-1.5 rounded-full text-xs font-bold border border-amber-500/20">
                                                    <i className="fa-solid fa-users"></i> المتبقي قبلك: {myTicket.peopleAhead} عملاء
                                                </div>
                                            </div>

                                            <div className="space-y-2 border-t border-slate-800 pt-4 text-xs text-slate-300">
                                                <div className="flex justify-between"><span>نوع الطلب:</span><span className="font-bold text-white">{myTicket.type}</span></div>
                                                <div className="flex justify-between"><span>المبلغ المحدد:</span><span className="font-bold text-white">{myTicket.amount}</span></div>
                                                <div className="flex justify-between"><span>الموعد:</span><span className="font-bold text-white">{myTicket.time}</span></div>
                                            </div>

                                            <div className="mt-6 p-3 bg-slate-800/80 rounded-xl text-center text-xs text-amber-300 border border-slate-700">
                                                <i className="fa-brands fa-whatsapp text-green-400 ml-1"></i> سيتم إرسال إشعار تلقائي عبر الواتساب عندما يتبقى 5 أرقام على دورك!
                                            </div>

                                            {waStatus && <p className="mt-2 text-center text-xs font-bold text-slate-400">{waStatus}</p>}
                                        </div>
                                    ) : (
                                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 text-center h-full flex flex-col justify-center items-center">
                                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-2xl mb-4">
                                                <i className="fa-solid fa-ticket"></i>
                                            </div>
                                            <h3 className="font-bold text-slate-800 text-lg mb-1">لا توجد تذكرة نشطة حالياً</h3>
                                            <p className="text-xs text-slate-500 max-w-xs">قم بملء البيانات في النموذج المباشر لإصدار رقم الدور والحصول على التنبيهات.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: RATES & CALCULATOR */}
                        {activeTab === 'rates' && (
                            <div className="grid lg:grid-cols-3 gap-8">
                                {/* Currency Table */}
                                <div className="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <div className="flex justify-between items-center mb-6">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-900">أسعار العملات اليوم (بنك مصر / البنك المركزي)</h2>
                                            <p className="text-xs text-slate-500 mt-1"><i className="fa-solid fa-rotate ml-1 text-amber-500"></i> آخر تحديث تلقائي: {lastUpdated}</p>
                                        </div>
                                        <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1">
                                            <span className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> تحديث مباشر
                                        </span>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-right">
                                            <thead>
                                                <tr className="border-b border-slate-200 text-xs text-slate-400 font-bold">
                                                    <th className="pb-3">العملة</th>
                                                    <th className="pb-3">شراء (نشتري منك)</th>
                                                    <th className="pb-3">بيع (نبيع لك)</th>
                                                    <th className="pb-3">التغير</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {currencies.map(curr => (
                                                    <tr key={curr.code} className="hover:bg-slate-50/80 transition-colors">
                                                        <td className="py-4 font-bold flex items-center gap-2">
                                                            <span className="w-8 h-8 rounded-full bg-slate-100 border flex items-center justify-center text-xs font-black">{curr.code}</span>
                                                            {curr.name}
                                                        </td>
                                                        <td className="py-4 font-bold text-emerald-600">{curr.buy.toFixed(2)} ج.م</td>
                                                        <td className="py-4 font-bold text-slate-900">{curr.sell.toFixed(2)} ج.م</td>
                                                        <td className={`py-4 font-bold text-xs ${curr.change.startsWith('+') ? 'text-emerald-500' : curr.change.startsWith('-') ? 'text-rose-500' : 'text-slate-400'}`}>
                                                            {curr.change}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Calculator */}
                                <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl border border-slate-800 flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                                            <i className="fa-solid fa-calculator"></i> الآلة الحاسبة الذكية
                                        </h3>

                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1">نوع العملية</label>
                                                <div className="grid grid-cols-2 gap-2 bg-slate-800 p-1 rounded-xl">
                                                    <button type="button" onClick={()=>setCalcType('buy')} className={`py-2 text-xs font-bold rounded-lg transition-all ${calcType === 'buy' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}>نشتري منك (شراء)</button>
                                                    <button type="button" onClick={()=>setCalcType('sell')} className={`py-2 text-xs font-bold rounded-lg transition-all ${calcType === 'sell' ? 'bg-amber-500 text-slate-900' : 'text-slate-400'}`}>نبيع لك (بيع)</button>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1">اختر العملة</label>
                                                <select value={calcCurrency} onChange={e=>setCalcCurrency(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white outline-none">
                                                    {currencies.map(c => <option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1">المبلغ بالعملة الأجنبية</label>
                                                <input type="number" value={calcAmount} onChange={e=>setCalcAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none text-left" dir="ltr" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 pt-6 border-t border-slate-800">
                                        <p className="text-xs text-slate-400 mb-1">الإجمالي التقديري بالجنيه المصري</p>
                                        <div className="text-3xl font-black text-amber-400">{totalEGP} <span className="text-sm font-normal text-slate-300">جنيه</span></div>
                                        <p className="text-[10px] text-slate-500 mt-2">* السعر المعتمد النهائي يتحدد عند الشباك فور التنفيذ.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: LIVE MONITOR & ANALYTICS */}
                        {activeTab === 'monitor' && (
                            <div className="space-y-8">
                                {/* Windows Status Grid */}
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                                        <i className="fa-solid fa-desktop text-amber-500"></i> شاشة عرض الصالة والشبابيك الحية
                                    </h2>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-slate-900 text-white p-4 rounded-2xl text-center border-b-4 border-emerald-500">
                                            <p className="text-xs text-slate-400 mb-1">شباك 1 (عادي)</p>
                                            <p className="text-3xl font-black text-amber-400">{currentServing.window1}</p>
                                        </div>
                                        <div className="bg-slate-900 text-white p-4 rounded-2xl text-center border-b-4 border-emerald-500">
