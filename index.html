
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الصرافة المصرية - فرع سمالوط</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_RATES = [
            { code: 'USD', name: 'دولار أمريكي', buy: 48.50, sell: 48.60, change: '+0.10' },
            { code: 'EUR', name: 'يورو أوروبي', buy: 52.30, sell: 52.50, change: '-0.05' },
            { code: 'SAR', name: 'ريال سعودي', buy: 12.92, sell: 12.96, change: '0.00' },
            { code: 'AED', name: 'درهم إماراتي', buy: 13.20, sell: 13.24, change: '0.00' },
            { code: 'GBP', name: 'جنيه إسترليني', buy: 61.80, sell: 62.15, change: '+0.25' },
            { code: 'KWD', name: 'دينار كويتي', buy: 157.80, sell: 158.50, change: '+0.40' },
            { code: 'QAR', name: 'ريال قطري', buy: 13.30, sell: 13.35, change: '0.00' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('queue');
            const [currencies, setCurrencies] = useState(INITIAL_RATES);
            const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString('ar-EG'));

            const [calcAmount, setCalcAmount] = useState(100);
            const [calcCurrency, setCalcCurrency] = useState('USD');
            const [calcType, setCalcType] = useState('buy');

            const [phone, setPhone] = useState('');
            const [serviceType, setServiceType] = useState('standard');
            const [amount, setAmount] = useState('');
            const [selectedCurrency, setSelectedCurrency] = useState('USD');
            const [appointmentTime, setAppointmentTime] = useState('');
            const [isFastTrack, setIsFastTrack] = useState(false);
            const [myTicket, setMyTicket] = useState(null);

            const [waInstanceId, setWaInstanceId] = useState('');
            const [waToken, setWaToken] = useState('');
            const [waStatus, setWaStatus] = useState('');

            const handleGetTicket = (e) => {
                e.preventDefault();
                if (!phone) {
                    alert('يرجى إدخال رقم هاتف الواتساب أولاً');
                    return;
                }

                const ticketPrefix = isFastTrack ? 'F' : serviceType === 'appointment' ? 'B' : 'A';
                const ticketNumber = `${ticketPrefix}-${Math.floor(Math.random() * 80) + 100}`;
                const aheadCount = Math.floor(Math.random() * 4) + 2;

                setMyTicket({
                    number: ticketNumber,
                    phone: phone,
                    service: serviceType === 'pre-order' ? 'صرف مسبق' : serviceType === 'appointment' ? 'حجز موعد' : 'صرف عادي',
                    amountDetails: amount ? `${amount} ${selectedCurrency}` : 'غير محدد',
                    time: appointmentTime || 'فور الوصول',
                    ahead: aheadCount
                });
            };

            const selectedCurrObj = currencies.find(c => c.code === calcCurrency) || currencies[0];
            const currentRate = calcType === 'buy' ? selectedCurrObj.buy : selectedCurrObj.sell;
            const totalEgp = (calcAmount * currentRate).toLocaleString('ar-EG', { maximumFractionDigits: 2 });

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-16">
                    {/* Header */}
                    <header className="bg-slate-900 border-b border-amber-500/30 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg">
                                    <i className="fa-solid fa-building-columns"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-amber-400">شركة الصرافة المصرية</h1>
                                    <p className="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                                        <i className="fa-solid fa-location-dot text-amber-500"></i> فرع سمالوط - محافظة المنيا
                                    </p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 text-xs">
                                <a href="tel:0863446509" className="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl transition-all font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-phone text-amber-400"></i> 086-3446509
                                </a>
                                <a href="tel:0863446519" className="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700 px-3.5 py-2 rounded-xl transition-all font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-phone text-amber-400"></i> 086-3446519
                                </a>
                                <a href="https://maps.google.com/?q=Samalut+Minya+Egypt" target="_blank" className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl transition-all font-black flex items-center gap-2 shadow-md">
                                    <i className="fa-solid fa-map-location-dot"></i> موقع GPS
                                </a>
                            </div>
                        </div>

                        <div className="bg-slate-900/90 border-t border-slate-800 py-2.5 px-4 text-xs text-slate-300">
                            <div className="max-w-7xl mx-auto flex flex-wrap justify-around items-center gap-2 text-center">
                                <div><i className="fa-regular fa-clock text-amber-400 ml-1.5"></i><strong>جميع أيام الأسبوع:</strong> من 8:00 صباحاً حتى 9:00 مساءً</div>
                                <div className="hidden md:block text-slate-700">|</div>
                                <div><i className="fa-solid fa-mosque text-amber-400 ml-1.5"></i><strong>يوم الجمعة:</strong> من بعد صلاة الجمعة حتى 9:00 مساءً</div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation */}
                    <div className="max-w-7xl mx-auto px-4 mt-8">
                        <div className="flex border-b border-slate-800 overflow-x-auto gap-2">
                            <button onClick={()=>setActiveTab('queue')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all ${activeTab==='queue'?'bg-amber-500 text-slate-950':'bg-slate-900 text-slate-400'}`}>
                                <i className="fa-solid fa-ticket ml-1"></i> خدمة الدور والانتظار الذكي
                            </button>
                            <button onClick={()=>setActiveTab('rates')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all ${activeTab==='rates'?'bg-amber-500 text-slate-950':'bg-slate-900 text-slate-400'}`}>
                                <i className="fa-solid fa-calculator ml-1"></i> أسعار العملات والحاسبة
                            </button>
                        </div>
                    </div>

                    {/* Content */}
                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        {activeTab === 'queue' ? (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                                    <h2 className="text-xl font-black text-amber-400 mb-2"><i className="fa-solid fa-mobile-screen-button ml-2"></i> حجز رقم دور إلكتروني</h2>
                                    <form onSubmit={handleGetTicket} className="space-y-4 mt-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-300 mb-1">رقم الهاتف (واتساب)</label>
                                            <input type="tel" required placeholder="01012345678" value={phone} onChange={e=>setPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-left text-white" dir="ltr" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-300 mb-1">اختر الخدمة</label>
                                            <select value={serviceType} onChange={e=>setServiceType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white">
                                                <option value="standard">صرف / تغيير عادي</option>
                                                <option value="pre-order">صرف مسبق (تحديد المبلغ قبل الوصول)</option>
                                                <option value="appointment">حجز موعد محدد</option>
                                            </select>
                                        </div>

                                        <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-4 rounded-xl shadow-lg">
                                            تأكيد والحصول على رقم الدور
                                        </button>
                                    </form>
                                </div>

                                <div className="flex items-center justify-center">
                                    {myTicket ? (
                                        <div className="bg-slate-900 border-2 border-amber-500 rounded-3xl p-6 w-full text-center">
                                            <p className="text-xs text-slate-400">رقم دورك الحالي</p>
                                            <div className="text-6xl font-black text-amber-400 my-2">{myTicket.number}</div>
                                            <p className="text-xs text-amber-300">المتبقي قبلك: {myTicket.ahead} عملاء</p>
                                        </div>
                                    ) : (
                                        <p className="text-slate-500 text-sm">ادخل بياناتك لإصدار رقم الدور</p>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                                <h2 className="text-xl font-black text-white mb-4">أسعار العملات الحية</h2>
                                <div className="grid md:grid-cols-2 gap-4">
                                    {currencies.map(c => (
                                        <div key={c.code} className="bg-slate-950 p-4 rounded-2xl flex justify-between items-center border border-slate-800">
                                            <span className="font-bold">{c.name} ({c.code})</span>
                                            <span className="text-emerald-400 font-bold">{c.buy} ج.م</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
