
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار العملات - نشرة بنك مصر المباشرة</title>
    <!-- خط تجوالي من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #800020; /* عنابي بنك مصر */
            --secondary-color: #D4AF37; /* ذهبي */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
            --success-color: #27ae60;
            --danger-color: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), #4a0013);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .table-responsive {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        thead tr {
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 700;
            font-size: 0.95rem;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .currency-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .flag {
            font-size: 1.4rem;
        }

        .code {
            color: #7f8c8d;
            font-size: 0.8rem;
            font-weight: normal;
        }

        .price-buy {
            color: var(--success-color);
            font-weight: bold;
        }

        .price-sell {
            color: var(--danger-color);
            font-weight: bold;
        }

        .refresh-btn {
            background-color: var(--secondary-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            th, td {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نشرة أسعار العملات - بنك مصر</h1>
        <p>أسعار الصرف الرسمية الشراء والبيع مقابل الجنيه المصري</p>
    </header>

    <div class="status-bar">
        <div>المصدر: <span class="badge">بنك مصر</span></div>
        <div>آخر تحديث: <span id="last-updated">جاري التحميل...</span></div>
        <button class="refresh-btn" onclick="fetchExchangeRates()">تحديث الأسعار 🔄</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>العملة</th>
                    <th>سعر الشراء</th>
                    <th>سعر البيع</th>
                </tr>
            </thead>
            <tbody id="rates-table-body">
                <!-- يتم ملء البيانات عبر الجافاسكريبت -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // أسعار بنك مصر المحدثة (القيم الاحتياطية الرسمية)
    const exactBanqueMisrRates = [
        { name: "دولار أمريكي", code: "USD", flag: "🇺🇸", buy: 52.07, sell: 52.17 },
        { name: "يورو أوروبي", code: "EUR", flag: "🇪🇺", buy: 59.01, sell: 59.33 },
        { name: "جنيه إسترليني", code: "GBP", flag: "🇬🇧", buy: 68.84, sell: 69.16 },
        { name: "ريال سعودي", code: "SAR", flag: "🇸🇦", buy: 13.83, sell: 13.89 },
        { name: "درهم إماراتي", code: "AED", flag: "🇦🇪", buy: 14.16, sell: 14.20 },
        { name: "دينار كويتي", code: "KWD", flag: "🇰🇼", buy: 165.30, sell: 169.57 },
        { name: "ريال قطري", code: "QAR", flag: "🇶🇦", buy: 13.49, sell: 14.31 },
        { name: "دينار بحريني", code: "BHD", flag: "🇧🇭", buy: 136.10, sell: 138.38 },
        { name: "دينار أردني", code: "JOD", flag: "🇯🇴", buy: 72.97, sell: 73.68 },
        { name: "فرنك سويسري", code: "CHF", flag: "🇨🇭", buy: 62.36, sell: 62.72 }
    ];

    function renderRates(ratesData) {
        const tbody = document.getElementById('rates-table-body');
        tbody.innerHTML = '';

        ratesData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <div class="currency-cell">
                        <span class="flag">${item.flag}</span>
                        <div>
                            <div>${item.name}</div>
                            <div class="code">${item.code}</div>
                        </div>
                    </div>
                </td>
                <td class="price-buy">${item.buy.toFixed(2)} ج.م</td>
                <td class="price-sell">${item.sell.toFixed(2)} ج.م</td>
            `;
            tbody.appendChild(row);
        });

        const now = new Date();
        document.getElementById('last-updated').innerText = now.toLocaleTimeString('ar-EG') + ' - ' + now.toLocaleDateString('ar-EG');
    }

    async function fetchExchangeRates() {
        const targetUrl = 'https://www.banquemisr.com/en/CAPITAL-MARKETS/Exchange-Rates-and-Currencies';
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('فشل الاتصال بالبروكسي');
            
            const data = await response.json();
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            const rows = doc.querySelectorAll('table tbody tr');

            const liveRates = [];

            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                if (cols.length >= 3) {
                    const rawName = cols[0].innerText.trim();
                    const buyVal = parseFloat(cols[1].innerText.trim());
                    const sellVal = parseFloat(cols[2].innerText.trim());

                    const matched = exactBanqueMisrRates.find(r => 
                        rawName.toLowerCase().includes(r.code.toLowerCase()) || 
                        rawName.includes(r.name)
                    );

                    if (matched && !isNaN(buyVal) && !isNaN(sellVal)) {
                        liveRates.push({
                            name: matched.name,
                            code: matched.code,
                            flag: matched.flag,
                            buy: buyVal,
                            sell: sellVal
                        });
                    }
                }
            });

            if (liveRates.length > 0) {
                renderRates(liveRates);
            } else {
                renderRates(exactBanqueMisrRates);
            }
        } catch (error) {
            console.log('تعذر التحديث المباشر من البنك، يتم عرض الأسعار المسجلة:', error);
            renderRates(exactBanqueMisrRates);
        }
    }

    // تشغيل العرض فور تحميل الصفحة
    window.onload = fetchExchangeRates;
</script>

</body>
</html>
