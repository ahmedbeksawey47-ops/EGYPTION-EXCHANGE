
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الصرافة المصرية - فرع سمالوط</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel JS CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_RATES = [
            { code: 'USD', name: 'دولار أمريكي', buy: 48.50, sell: 48.60, change: '+0.10' },
            { code: 'EUR', name: 'يورو أوروبي', buy: 52.30, sell: 52.50, change: '-0.05' },
            { code: 'SAR', name: 'ريال سعودي', buy: 12.92, sell: 12.96, change: '0.00' },
            { code: 'AED', name: 'درهم إماراتي', buy: 13.20, sell: 13.24, change: '0.00' },
            { code: 'GBP', name: 'جنيه إسترليني', buy: 61.80, sell: 62.15, change: '+0.25' },
            { code: 'KWD', name: 'دينار كويتي', buy: 157.80, sell: 158.50, change: '+0.40' },
            { code: 'QAR', name: 'ريال قطري', buy: 13.30, sell: 13.35, change: '0.00' },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('queue');
            const [currencies, setCurrencies] = useState(INITIAL_RATES);
            const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString('ar-EG'));

            // Calculator
            const [calcAmount, setCalcAmount] = useState(100);
            const [calcCurrency, setCalcCurrency] = useState('USD');
            const [calcType, setCalcType] = useState('buy');

            // Smart Queue Form
            const [phone, setPhone] = useState('');
            const [serviceType, setServiceType] = useState('standard');
            const [amount, setAmount] = useState('');
            const [selectedCurrency, setSelectedCurrency] = useState('USD');
            const [appointmentTime, setAppointmentTime] = useState('');
            const [isFastTrack, setIsFastTrack] = useState(false);
            const [myTicket, setMyTicket] = useState(null);

            // WhatsApp Settings
            const [waInstanceId, setWaInstanceId] = useState('');
            const [waToken, setWaToken] = useState('');
            const [waStatus, setWaStatus] = useState('');

            // Live Counters & KPI
            const [servingWindows, setServingWindows] = useState({
                w1: 'A-102',
                w2: 'A-103',
                w3: 'F-15 (مسار سريع)',
                w4: 'B-201 (مواعيد)'
            });
            const [avgServiceTime, setAvgServiceTime] = useState('3.2 دقيقة');

            // Auto Rate Update Simulation / API Call
            useEffect(() => {
                const interval = setInterval(() => {
                    setLastUpdated(new Date().toLocaleTimeString('ar-EG'));
                }, 60000);
                return () => clearInterval(interval);
            }, []);

            // Issue Ticket
            const handleGetTicket = (e) => {
                e.preventDefault();
                if (!phone) {
                    alert('يرجى إدخال رقم هاتف الواتساب أولاً');
                    return;
                }

                const ticketPrefix = isFastTrack ? 'F' : serviceType === 'appointment' ? 'B' : 'A';
                const ticketNumber = `${ticketPrefix}-${Math.floor(Math.random() * 80) + 100}`;
                const aheadCount = Math.floor(Math.random() * 4) + 2;

                const ticketData = {
                    number: ticketNumber,
                    phone: phone,
                    service: serviceType === 'pre-order' ? 'صرف مسبق' : serviceType === 'appointment' ? 'حجز موعد' : 'صرف عادي',
                    amountDetails: amount ? `${amount} ${selectedCurrency}` : 'غير محدد',
                    time: appointmentTime || 'فور الوصول',
                    ahead: aheadCount
                };

                setMyTicket(ticketData);

                if (waInstanceId && waToken) {
                    sendWhatsApp(phone, `أهلاً بك في شركة الصرافة المصرية - فرع سمالوط.\nتم إصدار رقم دورك الإلكتروني: ${ticketNumber}\nعدد المنتظرين قبلك: ${aheadCount}\nسنقوم بتنبيهك عند تبقي 5 أرقام.`);
                }
            };

            const sendWhatsApp = (to, msg) => {
                setWaStatus('جاري إرسال الرسالة...');
                fetch(`https://api.ultramsg.com/${waInstanceId}/messages/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ token: waToken, to: to, body: msg })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.sent) setWaStatus('تم إرسال إشعار الواتساب بنجاح! 🟢');
                    else setWaStatus('خطأ في إرسال الواتساب، تحقق من البيانات 🔴');
                })
                .catch(() => setWaStatus('تعذر الاتصال بـ WhatsApp API 🔴'));
            };

            const selectedCurrObj = currencies.find(c => c.code === calcCurrency) || currencies[0];
            const currentRate = calcType === 'buy' ? selectedCurrObj.buy : selectedCurrObj.sell;
            const totalEgp = (calcAmount * currentRate).toLocaleString('ar-EG', { maximumFractionDigits: 2 });

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 pb-16">
                    {/* Header */}
                    <header className="bg-slate-900 border-b border-amber-500/30 sticky top-0 z-50 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 bg-gradient-to-tr from-amber-500 to-amber-300 rounded-2xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">
                                    <i className="fa-solid fa-building-columns"></i>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-black text-amber-400">شركة الصرافة المصرية</h1>
                                    <p className="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                                        <i className="fa-solid fa-location-dot text-amber-500"></i> فرع سمالوط - محافظة المنيا
                                    </p>
                                </div>
                            </div>

                            {/* Contact & GPS */}
                            <div className="flex flex-wrap items-center gap-2 text-xs">
                                <a href="tel:0863446509" className="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700/80 px-3.5 py-2 rounded-xl transition-all font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-phone text-amber-400"></i> 086-3446509
                                </a>
                                <a href="tel:0863446519" className="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700/80 px-3.5 py-2 rounded-xl transition-all font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-phone text-amber-400"></i> 086-3446519
                                </a>
                                <a href="https://maps.google.com/?q=Samalut+Minya+Egypt" target="_blank" className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl transition-all font-black flex items-center gap-2 shadow-md">
                                    <i className="fa-solid fa-map-location-dot"></i> موقع GPS
                                </a>
                            </div>
                        </div>

                        {/* Working Hours Bar */}
                        <div className="bg-slate-900/90 border-t border-slate-800 py-2.5 px-4 text-xs text-slate-300">
                            <div className="max-w-7xl mx-auto flex flex-wrap justify-around items-center gap-2 text-center">
                                <div><i className="fa-regular fa-clock text-amber-400 ml-1.5"></i><strong>جميع أيام الأسبوع:</strong> من 8:00 صباحاً حتى 9:00 مساءً</div>
                                <div className="hidden md:block text-slate-700">|</div>
                                <div><i className="fa-solid fa-mosque text-amber-400 ml-1.5"></i><strong>يوم الجمعة:</strong> من بعد صلاة الجمعة حتى 9:00 مساءً</div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="max-w-7xl mx-auto px-4 mt-8">
                        <div className="flex border-b border-slate-800 overflow-x-auto gap-2">
                            <button onClick={()=>setActiveTab('queue')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab==='queue'?'bg-amber-500 text-slate-950 shadow-lg':'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-ticket"></i> خدمة الدور والانتظار الذكي
                            </button>
                            <button onClick={()=>setActiveTab('rates')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab==='rates'?'bg-amber-500 text-slate-950 shadow-lg':'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-calculator"></i> أسعار العملات والحاسبة
                            </button>
                            <button onClick={()=>setActiveTab('monitor')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab==='monitor'?'bg-amber-500 text-slate-950 shadow-lg':'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-desktop"></i> شاشة الصالة والتحليل
                            </button>
                            <button onClick={()=>setActiveTab('api')} className={`px-5 py-3 font-bold text-sm rounded-t-2xl transition-all flex items-center gap-2 whitespace-nowrap ${activeTab==='api'?'bg-amber-500 text-slate-950 shadow-lg':'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                                <i className="fa-brands fa-whatsapp"></i> إعدادات إشعارات WhatsApp
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        {/* TAB 1: SMART QUEUE */}
                        {activeTab === 'queue' && (
                            <div className="grid md:grid-cols-2 gap-8">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h2 className="text-xl font-black text-amber-400 mb-2 flex items-center gap-2">
                                        <i className="fa-solid fa-mobile-screen-button"></i> حجز رقم دور وتسهيل الانتظار
                                    </h2>
                                    <p className="text-xs text-slate-400 mb-6">سجل برقم الواتساب الخاص بك لتصلك تنبيهات الاقتراب والتذكرة آلياً.</p>

                                    <form onSubmit={handleGetTicket} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-300 mb-1.5">رقم الهاتف (واتساب)</label>
                                            <input type="tel" required placeholder="01012345678" value={phone} onChange={e=>setPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-left text-white outline-none focus:border-amber-500 transition-all" dir="ltr" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-300 mb-1.5">اختر الخدمة</label>
                                            <select value={serviceType} onChange={e=>setServiceType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white outline-none focus:border-amber-500 transition-all">
                                                <option value="standard">صرف / تغيير عادي</option>
                                                <option value="pre-order">صرف مسبق (تحديد المبلغ قبل الوصول للشباك)</option>
                                                <option value="appointment">حجز موعد محدد في وقت لاحق</option>
                                            </select>
                                        </div>

                                        {serviceType === 'pre-order' && (
                                            <div className="p-4 bg-slate-950/80 border border-amber-500/30 rounded-2xl grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-xs font-bold text-amber-400 mb-1">المبلغ المراد صرفه</label>
                                                    <input type="number" placeholder="1000" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-white outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-amber-400 mb-1">العملة</label>
                                                    <select value={selectedCurrency} onChange={e=>setSelectedCurrency(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-white outline-none">
                                                        {currencies.map(c => <option key={c.code} value={c.code}>{c.name}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                        )}

                                        {serviceType === 'appointment' && (
                                            <div className="p-4 bg-slate-950/80 border border-amber-500/30 rounded-2xl">
                                                <label className="block text-xs font-bold text-amber-400 mb-1">اختر الوقت المناسب</label>
                                                <input type="time" value={appointmentTime} onChange={e=>setAppointmentTime(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-white outline-none" />
                                            </div>
                                        )}

                                        <div className="flex items-center gap-2 p-3 bg-slate-950/50 border border-slate-800 rounded-xl">
                                            <input type="checkbox" id="fastTrack" checked={isFastTrack} onChange={e=>setIsFastTrack(e.target.checked)} className="w-4 h-4 text-amber-500 rounded bg-slate-900" />
                                            <label htmlFor="fastTrack" className="text-xs font-bold text-slate-300 cursor-pointer">
                                                المسار السريع (مبالغ محدودة أقل من 500 دولار / طلب جاهز)
                                            </label>
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black py-4 rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 text-base">
                                            <i className="fa-solid fa-check-circle"></i> تأكيد وحصول على رقم الدور
                                        </button>
                                    </form>
                                </div>

                                {/* Ticket Output */}
                                <div className="flex flex-col justify-center">
                                    {myTicket ? (
                                        <div className="bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-amber-500 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                                            <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                                                <span className="text-xs font-extrabold text-amber-400 flex items-center gap-1.5"><i className="fa-solid fa-circle-dot text-emerald-500 animate-pulse"></i> تذكرة نشطة</span>
                                                <span className="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300">{myTicket.phone}</span>
                                            </div>

                                            <div className="text-center py-6">
                                                <p className="text-xs text-slate-400 mb-1">رقم دورك الحالي</p>
                                                <div className="text-6xl font-black text-amber-400 tracking-wider mb-2">{myTicket.number}</div>
                                                <div className="inline-flex items-center gap-2 bg-amber-500/10 text-amber-400 px-4 py-1.5 rounded-full text-xs font-bold border border-amber-500/20">
                                                    <i className="fa-solid fa-users"></i> المتبقي قبلك: {myTicket.ahead} عملاء
                                                </div>
                                            </div>

                                            <div className="space-y-2 border-t border-slate-800 pt-4 text-xs text-slate-300">
                                                <div className="flex justify-between"><span>نوع الخدمة:</span><span className="font-bold text-white">{myTicket.service}</span></div>
                                                <div className="flex justify-between"><span>المبلغ المحدد:</span><span className="font-bold text-white">{myTicket.amountDetails}</span></div>
                                                <div className="flex justify-between"><span>الوقت المحدد:</span><span className="font-bold text-white">{myTicket.time}</span></div>
                                            </div>

                                            <div className="mt-6 p-3 bg-slate-800/80 rounded-xl text-center text-xs text-emerald-400 border border-slate-700/80">
                                                <i className="fa-brands fa-whatsapp text-emerald-400 ml-1"></i> سيصلك إشعار تلقائي عبر الواتساب عندما يتبقى 5 أرقام فقط على دورك!
                                            </div>

                                            {waStatus && <p className="mt-2 text-center text-xs font-bold text-slate-400">{waStatus}</p>}
                                        </div>
                                    ) : (
                                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center flex flex-col items-center justify-center min-h-[350px]">
                                            <div className="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center text-2xl mb-4 border border-amber-500/20">
                                                <i className="fa-solid fa-ticket"></i>
                                            </div>
                                            <h3 className="font-extrabold text-slate-200 text-lg mb-1">لا توجد تذكرة نشطة</h3>
                                            <p className="text-xs text-slate-500 max-w-xs">ادخل رقم الواتساب واختر نوع الخدمة لإصدار تذكرة انتظار إلكترونية سهلة.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: RATES & CALCULATOR */}
                        {activeTab === 'rates' && (
                            <div className="grid lg:grid-cols-3 gap-8">
                                <div className="lg:col-span-2 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <div className="flex justify-between items-center mb-6">
                                        <div>
                                            <h2 className="text-xl font-black text-white">أسعار العملات المحدثة (بنك مصر)</h2>
                                            <p className="text-xs text-slate-400 mt-1"><i className="fa-solid fa-rotate ml-1 text-amber-400"></i> آخر تحديث للأسعار: {lastUpdated}</p>
                                        </div>
                                        <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1.5">
                                            <span className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> تحديث حي
                                        </span>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-right">
                                            <thead>
                                                <tr className="border-b border-slate-800 text-xs text-slate-400 font-bold">
                                                    <th className="pb-3">العملة</th>
                                                    <th className="pb-3">شراء (نشتري منك)</th>
                                                    <th className="pb-3">بيع (نبيع لك)</th>
                                                    <th className="pb-3">التغير</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/60 text-sm">
                                                {currencies.map(curr => (
                                                    <tr key={curr.code} className="hover:bg-slate-800/40 transition-colors">
                                                        <td className="py-4 font-bold flex items-center gap-2">
                                                            <span className="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-black text-amber-400">{curr.code}</span>
                                                            {curr.name}
                                                        </td>
                                                        <td className="py-4 font-bold text-emerald-400">{curr.buy.toFixed(2)} ج.م</td>
                                                        <td className="py-4 font-bold text-slate-200">{curr.sell.toFixed(2)} ج.م</td>
                                                        <td className={`py-4 font-bold text-xs ${curr.change.startsWith('+') ? 'text-emerald-400' : curr.change.startsWith('-') ? 'text-rose-400' : 'text-slate-500'}`}>
                                                            {curr.change}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Calculator */}
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-lg font-black text-amber-400 mb-4 flex items-center gap-2">
                                            <i className="fa-solid fa-calculator"></i> حاسبة العملات الذكية
                                        </h3>

                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1.5 font-bold">نوع المعاملة</label>
                                                <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                                    <button type="button" onClick={()=>setCalcType('buy')} className={`py-2 text-xs font-bold rounded-lg transition-all ${calcType==='buy'?'bg-amber-500 text-slate-950':'text-slate-400'}`}>شراء (نشتري منك)</button>
                                                    <button type="button" onClick={()=>setCalcType('sell')} className={`py-2 text-xs font-bold rounded-lg transition-all ${calcType==='sell'?'bg-amber-500 text-slate-950':'text-slate-400'}`}>بيع (نبيع لك)</button>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1.5 font-bold">العملة</label>
                                                <select value={calcCurrency} onChange={e=>setCalcCurrency(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white outline-none">
                                                    {currencies.map(c => <option key={c.code} value={c.code}>{c.name} ({c.code})</option>)}
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1.5 font-bold">المبلغ</label>
                                                <input type="number" value={calcAmount} onChange={e=>setCalcAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white font-bold outline-none text-left" dir="ltr" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 pt-6 border-t border-slate-800">
                                        <p className="text-xs text-slate-400 mb-1">الإجمالي بالجنيه المصري</p>
                                        <div className="text-3xl font-black text-amber-400">{totalEgp} <span className="text-sm font-normal text-slate-300">جنيه</span></div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: LIVE MONITOR */}
                        {activeTab === 'monitor' && (
                            <div className="space-y-8">
                                <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h2 className="text-xl font-black text-white mb-6 flex items-center gap-2">
                                        <i className="fa-solid fa-desktop text-amber-400"></i> شاشة عرض أرقام الانتظار والشبابيك
                                    </h2>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-slate-950 p-5 rounded-2xl border-b-4 border-emerald-500 text-center">
                                            <p className="text-xs text-slate-400 mb-1 font-bold">شباك 1 (عادي)</p>
                                            <p className="text-3xl font-black text-amber-400">{servingWindows.w1}</p>
                                        </div>
                                        <div className="bg-slate-950 p-5 rounded-2xl border-b-4 border-emerald-500 text-center">
                                            <p className="text-xs text-slate-400 mb-1 font-bold">شباك 2 (عادي)</p>
                                            <p className="text-3xl font-black text-amber-400">{servingWindows.w2}</p>
                                        </div>
                                        <div className="bg-slate-950 p-5 rounded-2xl border-b-4 border-amber-500 text-center">
                                            <p className="text-xs text-amber-400 mb-1 font-bold">شباك 3 (المسار السريع)</p>
                                            <p className="text-3xl font-black text-amber-400">{servingWindows.w3}</p>
                                        </div>
                                        <div className="bg-slate-950 p-5 rounded-2xl border-b-4 border-emerald-500 text-center">
                                            <p className="text-xs text-slate-400 mb-1 font-bold">شباك 4 (مواعيد)</p>
                                            <p className="text-3xl font-black text-amber-400">{servingWindows.w4}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-3 gap-6">
                                    <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 flex items-center gap-4">
                                        <div className="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center text-xl border border-amber-500/20">
                                            <i className="fa-solid fa-stopwatch"></i>
                                        </div>
                                        <div>
                                            <p className="text-xs text-slate-400 font-bold">متوسط زمن كل عملية</p>
                                            <p className="text-xl font-black text-white">{avgServiceTime}</p>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 flex items-center gap-4">
                                        <div className="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center text-xl border border-emerald-500/20">
                                            <i className="fa-solid fa-bolt"></i>
                                        </div>
                                        <div>
                                            <p className="text-xs text-slate-400 font-bold">المسار السريع الذكي</p>
                                            <p className="text-xl font-black text-white">مُفعّل (تقليل الزحام)</p>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 flex items-center gap-4">
                                        <div className="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-2xl flex items-center justify-center text-xl border border-blue-500/20">
                                            <i className="fa-solid fa-chart-line"></i>
                                        </div>
                                        <div>
                                            <p className="text-xs text-slate-400 font-bold">كفاءة تشغيل الصالة</p>
                                            <p className="text-xl font-black text-emerald-400">ممتازة (98%)</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: WHATSAPP API */}
                        {activeTab === 'api' && (
                            <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800 max-w-xl mx-auto">
                                <h2 className="text-xl font-black text-white mb-2 flex items-center gap-2">
                                    <i className="fa-brands fa-whatsapp text-emerald-400 text-2xl"></i> ربط WhatsApp Live API
                                </h2>
                                <p className="text-xs text-slate-400 mb-6">أدخل بيانات API الخاصة بك لإرسال رسائل حقيقية لهواتف العملاء عند إصدار التذكرة واقتراب دورهم.</p>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 mb-1.5">Instance ID</label>
                                        <input type="text" value={waInstanceId} onChange={e=>setWaInstanceId(e.target.value)} placeholder="instance12345" className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white outline-none font-mono text-xs" dir="ltr" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 mb-1.5">Token</label>
                                        <input type="password" value={waToken} onChange={e=>setWaToken(e.target.value)} placeholder="••••••••••••••••" className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white outline-none font-mono text-xs" dir="ltr" />
                                    </div>

                                    <button onClick={() => {
                                        if(!waInstanceId || !waToken) alert('يرجى إدخال Instance ID و Token');
                                        else alert('تم حفظ الإعدادات بنجاح!');
                                    }} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all">
                                        حفظ البيانات
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="max-w-7xl mx-auto px-4 mt-16 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-6">
                        <p>© 2026 شركة الصرافة المصرية - فرع سمالوط. جميع الحقوق محفوظة.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
